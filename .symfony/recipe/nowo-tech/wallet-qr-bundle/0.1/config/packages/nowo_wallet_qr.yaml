nowo_wallet_qr:
    google_wallet:
        enabled: false
        issuer_id: '%env(GOOGLE_WALLET_ISSUER_ID)%'
        service_account_json: '%kernel.project_dir%/config/google-wallet-service-account.json'
        origins: []
    apple_wallet:
        enabled: false
        pass_download_url_pattern: 'https://example.com/wallet/{pass_id}.pkpass'
    # QR size, margin, error correction and the URL allowlist are configured on
    # nowo_qr_code (config/packages/nowo_qr_code.yaml, nowo-tech/qr-code-bundle).
    # The legacy nowo_wallet_qr.qr_code node is deprecated since 3.2. In prod set
    # real hosts on nowo_qr_code.profiles.default.url_allowlist (never example.com).
